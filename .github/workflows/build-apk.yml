name: Build APK

on:
  push:
    branches: [ main, copilot/create-android-app-frontend ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Download Gradle 8.0
      run: |
        wget https://services.gradle.org/distributions/gradle-8.0-bin.zip -P /tmp
        unzip -d /tmp /tmp/gradle-8.0-bin.zip
        
    - name: Generate Gradle Wrapper
      run: /tmp/gradle-8.0/bin/gradle wrapper --gradle-version 8.0
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
        
    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
